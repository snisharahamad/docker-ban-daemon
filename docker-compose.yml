services:
  traefik:
    image: traefik:v2.11
    container_name: traefik-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - dockban-net

  vulnerable-api:
    image: python:3.11-alpine
    container_name: vulnerable-api
    volumes:
      - ./target:/app
    command: >
      sh -c "pip install flask gunicorn && cd /app && gunicorn --workers 2 --bind 0.0.0.0:5000 --reload server:app"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.dockban.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
    networks:
      - dockban-net

networks:
  dockban-net:
    name: dockban-net
